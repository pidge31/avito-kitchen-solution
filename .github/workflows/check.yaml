name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kitchen_test
          POSTGRES_USER: kitchen
          POSTGRES_PASSWORD: kitchen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitchen -d kitchen_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check build
        env:
          TEST_DATABASE_URL: postgres://kitchen:kitchen@localhost:5432/kitchen_test?sslmode=disable
      - run: docker compose -p kitchen-ci up --build -d --wait
      - run: make smoke
      - if: failure()
        run: docker compose -p kitchen-ci logs --no-color
      - if: always()
        run: docker compose -p kitchen-ci down -v
