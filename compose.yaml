name: avito-kitchen

x-app: &app
  build: .
  image: avito-kitchen:local

x-db-env: &db-env
  DATABASE_URL: postgres://kitchen:${POSTGRES_PASSWORD:-kitchen}@db:5432/kitchen?sslmode=disable

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kitchen
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kitchen}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d kitchen"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["migrate", "up"]
    environment: *db-env
    depends_on:
      db:
        condition: service_healthy

  provision:
    <<: *app
    command: ["provision"]
    environment:
      <<: *db-env
      RESTAURANT_EXTERNAL_ID: demo-cafe
      RESTAURANT_NAME: Кухня на районе
      RESTAURANT_CITY: Москва
      RESTAURANT_CUISINE: Домашняя кухня
      RESTAURANT_API_KEY: ${RESTAURANT_API_KEY:-demo-cafe-secret-change-me}
    depends_on:
      migrate:
        condition: service_completed_successfully

  db-access:
    image: postgres:17-alpine
    entrypoint: ["psql"]
    command: ["--file=/runtime-role.sql"]
    environment:
      PGHOST: db
      PGUSER: kitchen
      PGDATABASE: kitchen
      PGPASSWORD: ${POSTGRES_PASSWORD:-kitchen}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:-demo-runtime-password-change-me}
    volumes:
      - ./deploy/runtime-role.sql:/runtime-role.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    environment:
      DATABASE_URL: postgres://kitchen_app:${APP_DATABASE_PASSWORD:-demo-runtime-password-change-me}@db:5432/kitchen?sslmode=disable
      HTTP_ADDR: :8080
      ORDER_TTL: ${ORDER_TTL:-2m}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-demo-gateway-secret-change-me-0001}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      provision:
        condition: service_completed_successfully
      db-access:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "api", "healthcheck"]
      interval: 3s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  restaurant:
    <<: *app
    entrypoint: ["restaurant"]
    command: []
    environment:
      PLATFORM_URL: http://api:8080
      RESTAURANT_API_KEY: ${RESTAURANT_API_KEY:-demo-cafe-secret-change-me}
      STEP_DELAY: ${STEP_DELAY:-3s}
      REJECT_ORDERS: ${REJECT_ORDERS:-false}
      HEALTHCHECK_URL: http://127.0.0.1:8081/healthz
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "api", "healthcheck"]
      interval: 3s
      timeout: 4s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
